[project]
name = "exohunter"
version = "0.1.0"
description = "Learning project: hunt for transit signals and anomalies in public NASA TESS data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "lightkurve>=2.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
    "plotly>=5.20",
    "streamlit>=1.35",
    "typer>=0.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
exohunter = "exohunter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exohunter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access to NASA archives (deselect with -m 'not network')"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
